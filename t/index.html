<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastestTrain – Track a train</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
            background: #0a0f1e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            text-align: center;
        }

        .icon {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            margin-bottom: 24px;
            /* Replace src with your actual app icon URL */
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .teal { color: #2cc4c4; }

        p {
            font-size: 16px;
            color: rgba(255,255,255,0.65);
            line-height: 1.5;
            max-width: 340px;
            margin-bottom: 36px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #2cc4c4;
            color: #0a0f1e;
            font-size: 17px;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 14px;
            text-decoration: none;
            margin-bottom: 16px;
        }

        .btn:hover { background: #25b0b0; }

        .hint {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 0;
        }

        .progress {
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.12);
            border-radius: 2px;
            margin: 20px auto 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #2cc4c4;
            border-radius: 2px;
            animation: fill 3s linear forwards;
        }

        @keyframes fill { to { width: 100%; } }
    </style>
</head>
<body>

    <img class="icon"
         src="https://apps.apple.com/favicon.ico"
         alt="FastestTrain"
         onerror="this.style.display='none'">

    <h1><span class="teal">Fastest</span>Train</h1>

    <p>Someone shared a train journey with you.<br>
       Open the app to start tracking it in real time.</p>

    <a class="btn" id="storeLink"
       href="https://apps.apple.com/app/id6754537947">
       <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
         <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
       </svg>
       Get FastestTrain – Free
    </a>

    <p class="hint">Redirecting to the App Store…</p>

    <div class="progress"><div class="progress-bar"></div></div>

    <script>
        var STORE = "https://apps.apple.com/app/id6754537947";
        setTimeout(function () { window.location.href = STORE; }, 3000);
    </script>
</body>
</html>
