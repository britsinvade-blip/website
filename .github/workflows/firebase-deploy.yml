name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  # Lets you re-run the deploy by hand from the Actions tab (e.g. after fixing permissions)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # No continue-on-error: if the deploy fails (e.g. a permissions problem),
      # the run goes red so a stale live site doesn't go unnoticed.
      - name: Deploy to Firebase
        id: firebase-deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
